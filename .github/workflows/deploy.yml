name: Test and deploy to GitHub Pages

# This publishes a PROJECT site for this repository only, at
# https://<owner>.github.io/StatPath/. It cannot modify a user site
# (the repo named <owner>.github.io) or any other repository's Pages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. The deploy job widens this for itself alone.
permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Also typechecks, via `tsc --noEmit` in the build script.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

  deploy:
    name: Deploy to GitHub Pages
    # Only the default branch publishes; pull requests stop after `test`.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Queue deployments instead of cancelling one that is already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A project site is served from /<repo>/, so assets must be built for
      # that prefix. Enabling Pages itself is a one-time manual step: the
      # default GITHUB_TOKEN may not create a Pages site, so set
      # Settings -> Pages -> Source to "GitHub Actions" once.
      - name: Build for /${{ github.event.repository.name }}/
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: pages_deploy
        uses: actions/deploy-pages@v4

      # A green deploy only means GitHub accepted the artifact. Confirm the
      # site actually serves, and that every asset the page references
      # resolves at the subfolder it was built for.
      - name: Smoke test the live site
        env:
          URL: ${{ steps.pages_deploy.outputs.page_url }}
        run: |
          set -uo pipefail
          echo "Checking $URL"
          code=000
          for i in $(seq 1 12); do
            code=$(curl -sS -o page.html -w '%{http_code}' -L "$URL" || echo 000)
            if [ "$code" = "200" ]; then break; fi
            echo "  attempt $i: HTTP $code, retrying in 10s"
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::page returned HTTP $code"
            exit 1
          fi
          if ! grep -q "<title>" page.html; then
            echo "::error::page has no <title>; it may be a 404 placeholder"
            head -40 page.html
            exit 1
          fi
          echo "Title: $(grep -o '<title>[^<]*</title>' page.html || echo '(none)')"
          origin=$(printf '%s' "$URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          fail=0
          found=0
          for a in $(grep -oE '(src|href)="[^"]+\.(js|css)"' page.html | sed -E 's/^[a-z]+="//; s/"$//'); do
            case "$a" in
              http*) u="$a" ;;
              /*)    u="${origin}${a}" ;;
              *)     u="${URL}${a}" ;;
            esac
            c=$(curl -sS -o /dev/null -w '%{http_code}' -L "$u" || echo 000)
            echo "  $c  $u"
            found=$((found + 1))
            if [ "$c" != "200" ]; then fail=1; fi
          done
          if [ "$found" = "0" ]; then
            echo "::error::no js/css assets referenced; the build output looks wrong"
            exit 1
          fi
          if [ "$fail" != "0" ]; then
            echo "::error::at least one asset did not return 200"
            exit 1
          fi
          echo "Live site OK: $URL ($found assets served)"
