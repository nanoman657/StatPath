[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-inventory"
version = "0.1.0"
description = "A SQLite home inventory (fridge, closets, wardrobe...) with an MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
home-inventory = "home_inventory.cli:main"
home-inventory-mcp = "home_inventory.server:main"

[tool.setuptools]
packages = ["home_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
